<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Super Resolution Camera</title>
    <!-- مكتبات الذكاء الاصطناعي الحقيقي (TensorFlow.js + ESRGAN Neural Model) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@upscalerjs/default-model@latest/dist/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }

        .header { text-align: center; }
        .header h1 { font-size: 1.2rem; color: #38bdf8; }
        .header p { font-size: 0.8rem; color: #94a3b8; }

        .camera-box { position: relative; width: 100%; height: 330px; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        video.mirror { transform: scaleX(-1); }

        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .btn-switch { padding: 10px 16px; background: #334155; color: #fff; border: none; border-radius: 20px; cursor: pointer; }
        .btn-capture { width: 65px; height: 65px; border-radius: 50%; background: #0284c7; border: 4px solid #fff; cursor: pointer; box-shadow: 0 0 15px rgba(2, 132, 199, 0.6); }

        .gallery { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .card { background: #1e293b; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #334155; }
        
        .status-box { font-size: 0.85rem; padding: 8px; border-radius: 6px; background: #0f172a; text-align: center; color: #38bdf8; font-weight: bold; }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .img-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; color: #94a3b8; }
        .img-wrap img { width: 100%; border-radius: 6px; border: 1px solid #475569; }

        .btn-download { background: #10b981; color: #fff; text-align: center; padding: 8px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔍 كاميرا التوضيح بالذكاء الاصطناعي (AI Upscaler)</h1>
        <p>توضيح البكسلات وإعادة بناء التفاصيل بنموذج ESRGAN</p>
    </div>

    <div class="camera-box">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <button class="btn-switch" id="switchBtn">🔄 تبديل الكاميرا</button>
        <button class="btn-capture" id="captureBtn" title="التقاط وتوضيح"></button>
    </div>

    <div class="gallery" id="gallery"></div>
</div>

<canvas id="tempCanvas"></canvas>

<script>
    const video = document.getElementById('video');
    const tempCanvas = document.getElementById('tempCanvas');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchBtn');
    const gallery = document.getElementById('gallery');

    let stream = null;
    let facingMode = "environment";
    let upscaler = null;

    // تهيئة نموذج الذكاء الاصطناعي عند فتح الصفحة
    async function initAI() {
        try {
            upscaler = new Upscaler({
                model: window.DefaultUpscalerJSModel || undefined
            });
            console.log("AI Model Loaded successfully");
        } catch (err) {
            console.error("فشل تحميل نموذج AI:", err);
        }
    }

    // تشغيل الكاميرا
    async function initCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode },
                audio: false
            });
            video.srcObject = stream;
            video.classList.toggle('mirror', facingMode === 'user');
        } catch (e) {
            alert("تعذر تشغيل الكاميرا: " + e.message);
        }
    }

    switchBtn.onclick = () => {
        facingMode = facingMode === "user" ? "environment" : "user";
        initCamera();
    };

    captureBtn.onclick = async () => {
        if (!video.videoWidth) return;

        // تجهيز مقاس مناسب للمعالجة السريعة على كارت الشاشة
        const targetWidth = 480;
        const scaleFactor = targetWidth / video.videoWidth;
        const w = targetWidth;
        const h = Math.round(video.videoHeight * scaleFactor);

        tempCanvas.width = w;
        tempCanvas.height = h;
        const ctx = tempCanvas.getContext('2d');

        if (facingMode === 'user') {
            ctx.translate(w, 0);
            ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, w, h);

        const originalUrl = tempCanvas.toDataURL('image/jpeg', 0.8);

        // إنشاء بطاقة العرض
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="status-box">⏳ الذكاء الاصطناعي يعيد رسم وتوضيح البكسلات... (0%)</div>
            <div class="comparison-grid">
                <div class="img-wrap">
                    <span>قبل (الأصلية)</span>
                    <img src="${originalUrl}">
                </div>
                <div class="img-wrap">
                    <span>بعد التوضيح (AI)</span>
                    <img id="enhanced-img" src="${originalUrl}" style="opacity: 0.5;">
                </div>
            </div>
            <a class="btn-download" style="display: none;" download="AI_Enhanced.png">📥 تحميل الصورة بعد التوضيح</a>
        `;
        gallery.prepend(card);

        const statusBox = card.querySelector('.status-box');
        const enhancedImg = card.querySelector('#enhanced-img');
        const downloadBtn = card.querySelector('.btn-download');

        try {
            if (!upscaler) await initAI();

            // تمرير الصورة إلى نموذج الذكاء الاصطناعي ESRGAN
            const enhancedBase64 = await upscaler.upscale(tempCanvas, {
                patchSize: 64, // تقسيم الصورة لمربعات صغيرة لتفادي ثقل الذاكرة
                padding: 4,
                progress: (percent) => {
                    statusBox.innerText = `⏳ جاري معالجة وتوضيح الملامح: ${Math.round(percent * 100)}%`;
                }
            });

            // عرض الصورة فائقة الدقة بعد المعالجة
            enhancedImg.src = enhancedBase64;
            enhancedImg.style.opacity = "1";
            statusBox.style.color = "#10b981";
            statusBox.innerText = "✓ تم توضيح الصورة وإزالة البكسلة بنجاح!";
            downloadBtn.href = enhancedBase64;
            downloadBtn.style.display = "block";

        } catch (err) {
            statusBox.style.color = "#ef4444";
            statusBox.innerText = "❌ حدث خطأ أثناء المعالجة: " + err.message;
        }
    };

    initCamera();
    initAI();
</script>
</body>
</html>
