<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة أوردرات الواتساب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-base: #0f1117;
            --bg-surface: #161922;
            --border-color: #2b313d;
            --text-main: #f0f3f6;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
        }

        .workspace {
            width: 100%;
            max-width: 850px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .header h1 { font-size: 17px; font-weight: 600; color: var(--text-main); }
        .header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .input-box {
            width: 100%;
            height: 140px;
            background: #0d0f14;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .counter-badge {
            background: #1f242d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
        }

        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            flex: 1;
            min-width: 110px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background-color: #1f242d;
            color: var(--text-main);
        }

        .btn-pdf { background-color: #f0f3f6; color: #0f1117; border: 1px solid #f0f3f6; font-weight: 600; }
        .btn-clear { background-color: transparent; color: var(--text-muted); border: 1px solid transparent; }

        .preview-wrapper { margin-top: 20px; width: 100%; overflow-x: auto; }
        
        #printable-area {
            background: #ffffff;
            color: #000000;
            padding: 12px;
            border-radius: 6px;
            min-width: 500px;
            direction: rtl;
        }

        table.orders-table { width: 100%; border-collapse: collapse; }
        
        table.orders-table td.order-cell {
            width: 48%;
            vertical-align: top;
            padding: 6px 8px;
            font-size: 11.5px;
            line-height: 1.5;
            direction: rtl;
            text-align: right;
            cursor: text;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        table.orders-table td.order-cell:hover {
            background-color: #f8fafc;
        }
        table.orders-table td.order-cell:focus {
            background-color: #ffffff;
            outline: 2px solid #3b82f6;
            border-radius: 4px;
        }

        table.orders-table td.divider-cell { 
            width: 2%; 
            border-right: 1px solid #ccc; 
            padding: 0; 
        }
        
        table.orders-table tr.order-row {
            border-bottom: 1px solid #e2e8f0;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            page-break-before: auto;
            page-break-after: auto;
        }

        @media (max-width: 480px) {
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="workspace">
        <div class="header">
            <h1></h1>
            <p></p>
        </div>

        <textarea id="rawInput" class="input-box" placeholder="حطي الداتا هنا" oninput="updateStats()"></textarea>

        <div class="meta-bar">
            <span>جاهز للاستخدام</span>
            <span class="counter-badge" id="orderCount">الأوردرات: 0</span>
        </div>

        <div class="actions">
            <button class="btn" onclick="renderData()">معاينة وتعديل</button>
            <button class="btn" onclick="copyTableData()">نسخ الجدول</button>
            <button class="btn btn-pdf" onclick="exportPDF()">تصدير PDF</button>
            <button class="btn btn-clear" onclick="clearAll()">مسح الكل</button>
        </div>

        <div class="preview-wrapper">
            <div id="printable-area"></div>
        </div>
    </div>

    <script>
        function processOrdersData() {
            const rawText = document.getElementById('rawInput').value.trim();
            if (!rawText) return null;

            const cleanedText = rawText.replace(/\[[^\]]+\]\s*(?:[^\n:]+?):\s*/g, '');
            const lines = cleanedText.split('\n');
            const orders = [];
            let currentOrder = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                currentOrder.push(line);
                if (line.includes('توتل') || line.includes('إجمالي') || line.includes('اجمالي')) {
                    orders.push(currentOrder.join('\n'));
                    currentOrder = [];
                }
            }
            if (currentOrder.length > 0) orders.push(currentOrder.join('\n'));

            document.getElementById('orderCount').innerText = `الأوردرات: ${orders.length}`;

            let htmlContent = '<table class="orders-table">';
            for (let i = 0; i < orders.length; i += 2) {
                const o1 = (orders[i] || '').replace(/\n/g, '<br>');
                const o2 = (orders[i + 1] || '').replace(/\n/g, '<br>');
                htmlContent += `
                    <tr class="order-row">
                        <td class="order-cell" contenteditable="true">${o1}</td>
                        <td class="divider-cell"></td>
                        <td class="order-cell" contenteditable="true">${o2}</td>
                    </tr>`;
            }
            htmlContent += '</table>';
            return htmlContent;
        }

        function updateStats() {
            const rawText = document.getElementById('rawInput').value.trim();
            const lines = rawText.replace(/\[[^\]]+\]\s*(?:[^\n:]+?):\s*/g, '').split('\n');
            let count = 0;
            for (let line of lines) {
                if (line.includes('توتل') || line.includes('إجمالي') || line.includes('اجمالي')) count++;
            }
            document.getElementById('orderCount').innerText = `الأوردرات: ${count || (rawText.length > 0 ? 1 : 0)}`;
        }

        function renderData() {
            const htmlContent = processOrdersData();
            if (!htmlContent) { alert('الرجاء لصق البيانات أولاً!'); return false; }
            document.getElementById('printable-area').innerHTML = htmlContent;
            return true;
        }

        function copyTableData() {
            const area = document.getElementById('printable-area');
            if (!area.innerHTML.trim()) {
                if (!renderData()) return;
            }
            
            const cells = area.querySelectorAll('[contenteditable]');
            cells.forEach(c => c.removeAttribute('contenteditable'));

            const range = document.createRange();
            range.selectNode(area);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            
            try {
                document.execCommand('copy');
                alert('تم نسخ الجدول بالتعديلات التي أجريتها بنجاح!');
            } catch (e) {
                alert('فشل النسخ');
            }
            
            window.getSelection().removeAllRanges();
            cells.forEach(c => c.setAttribute('contenteditable', 'true'));
        }

        function exportPDF() {
            const area = document.getElementById('printable-area');
            if (!area.innerHTML.trim()) {
                if (!renderData()) return;
            }

            const cells = area.querySelectorAll('[contenteditable]');
            cells.forEach(c => c.removeAttribute('contenteditable'));

            const opt = {
                margin: 5,
                filename: 'whatsapp_orders.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: window.innerWidth < 768 ? 1.5 : 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'], avoid: ['.order-row'] }
            };

            html2pdf().from(area).set(opt).save().then(() => {
                cells.forEach(c => c.setAttribute('contenteditable', 'true'));
            });
        }

        function clearAll() {
            document.getElementById('rawInput').value = '';
            document.getElementById('printable-area').innerHTML = '';
            document.getElementById('orderCount').innerText = `الأوردرات: 0`;
        }
    </script>
</body>
</html>
