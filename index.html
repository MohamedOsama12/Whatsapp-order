<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كاميرا HDR الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
        
        .camera-box { position: relative; width: 100%; height: 350px; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        video.mirror { transform: scaleX(-1); }
        
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .btn-switch { padding: 10px 16px; background: #334155; color: #fff; border: none; border-radius: 20px; cursor: pointer; }
        .btn-capture { width: 65px; height: 65px; border-radius: 50%; background: #ef4444; border: 4px solid #fff; cursor: pointer; box-shadow: 0 0 15px rgba(239,68,68,0.5); }
        
        .gallery { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .card { background: #1e293b; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #334155; }
        .badge { align-self: flex-start; background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 5px; font-size: 0.75rem; font-weight: bold; }
        .card img { width: 100%; border-radius: 6px; }
        .btn-download { background: #10b981; color: #fff; text-align: center; padding: 8px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
        
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="camera-box">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <button class="btn-switch" id="switchBtn">🔄 تبديل الكاميرا</button>
        <button class="btn-capture" id="captureBtn" title="التقاط وتطبيق HDR"></button>
    </div>

    <div class="gallery" id="gallery"></div>
</div>

<canvas id="tempCanvas"></canvas>
<canvas id="hdrCanvas"></canvas>

<script>
    const video = document.getElementById('video');
    const tempCanvas = document.getElementById('tempCanvas');
    const hdrCanvas = document.getElementById('hdrCanvas');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchBtn');
    const gallery = document.getElementById('gallery');

    let stream = null;
    let facingMode = "environment";

    async function initCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode },
                audio: false
            });
            video.srcObject = stream;
            video.classList.toggle('mirror', facingMode === 'user');
        } catch (e) {
            alert("تعذر تشغيل الكاميرا: " + e.message);
        }
    }

    switchBtn.onclick = () => {
        facingMode = facingMode === "user" ? "environment" : "user";
        initCamera();
    };

    // معالجة بكسلات الصورة لتطبيق خوارزمية الـ HDR الحقيقية
    function applyHDR(ctx, width, height) {
        const imgData = ctx.getImageData(0, 0, width, height);
        const d = imgData.data;

        for (let i = 0; i < d.length; i += 4) {
            let r = d[i], g = d[i + 1], b = d[i + 2];

            // 1. تفتيح الظلال وحفظ الإضاءة العالية (Tone-Mapping S-Curve)
            r = Math.pow(r / 255, 0.85) * 255;
            g = Math.pow(g / 255, 0.85) * 255;
            b = Math.pow(b / 255, 0.85) * 255;

            // 2. زيادة التباين الموضعي (Contrast Boost)
            r = (r - 128) * 1.25 + 128;
            g = (g - 128) * 1.25 + 128;
            b = (b - 128) * 1.25 + 128;

            // 3. تعزيز تشبع ألوان HDR (Vibrance / Saturation)
            let gray = 0.299 * r + 0.587 * g + 0.114 * b;
            r = gray + (r - gray) * 1.35;
            g = gray + (g - gray) * 1.35;
            b = gray + (b - gray) * 1.35;

            // حفظ الحدود (0 - 255)
            d[i]     = Math.min(255, Math.max(0, r));
            d[i + 1] = Math.min(255, Math.max(0, g));
            d[i + 2] = Math.min(255, Math.max(0, b));
        }

        ctx.putImageData(imgData, 0, 0);
    }

    captureBtn.onclick = () => {
        if (!video.videoWidth) return;

        const w = video.videoWidth;
        const h = video.videoHeight;

        tempCanvas.width = w;
        tempCanvas.height = h;
        const tCtx = tempCanvas.getContext('2d');

        if (facingMode === 'user') {
            tCtx.translate(w, 0);
            tCtx.scale(-1, 1);
        }
        tCtx.drawImage(video, 0, 0, w, h);

        hdrCanvas.width = w;
        hdrCanvas.height = h;
        const hCtx = hdrCanvas.getContext('2d');

        // تطبيق حدة ووضوح (Sharpening / Clarity Filter)
        hCtx.filter = 'contrast(110%) brightness(102%)';
        hCtx.drawImage(tempCanvas, 0, 0, w, h);

        // تطبيق خوارزمية الـ HDR
        applyHDR(hCtx, w, h);

        const hdrImageURL = hdrCanvas.toDataURL('image/jpeg', 0.95);

        // إضافة الصورة للمعرض
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <span class="badge">تم تطبيق فلتر /HDR ✓</span>
            <img src="${hdrImageURL}">
            <a class="btn-download" href="${hdrImageURL}" download="HDR_Photo_${Date.now()}.jpg">📥 تحميل الصورة</a>
        `;
        gallery.prepend(card);
    };

    initCamera();
</script>
</body>
</html>
