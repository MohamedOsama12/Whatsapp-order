<!DOCTYPE html>
<html lang="ar" dir="rtl" class="theme-emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة أوردرات الواتساب - ثيمات متقدمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* الثيم الأول: ميدنايت إيمرالد */
        :root.theme-emerald {
            --bg-base: #060d0a;
            --bg-surface: #0e1913;
            --bg-element: #16261e;
            --border-color: rgba(52, 211, 153, 0.12);
            --border-hover: rgba(52, 211, 153, 0.35);
            --text-main: #f0fdf4;
            --text-muted: #6ee7b7;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --primary-btn: #10b981;
            --primary-hover: #059669;
        }

        /* الثيم الثاني: أمبير برو */
        :root.theme-amber {
            --bg-base: #12100e;
            --bg-surface: #1a1714;
            --bg-element: #26221d;
            --border-color: rgba(245, 158, 11, 0.12);
            --border-hover: rgba(245, 158, 11, 0.35);
            --text-main: #fafaf9;
            --text-muted: #d6d3d1;
            --accent-glow: rgba(245, 158, 11, 0.2);
            --primary-btn: #f59e0b;
            --primary-hover: #d97706;
        }

        /* الثيم الثالث: فايبر روز */
        :root.theme-rose {
            --bg-base: #11090c;
            --bg-surface: #1c1015;
            --bg-element: #28171f;
            --border-color: rgba(244, 63, 94, 0.12);
            --border-hover: rgba(244, 63, 94, 0.35);
            --text-main: #fff1f2;
            --text-muted: #fda4af;
            --accent-glow: rgba(244, 63, 94, 0.2);
            --primary-btn: #f43f5e;
            --primary-hover: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
        }

        .workspace {
            width: 100%;
            max-width: 900px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
        }

        .header-titles h1 { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .header-titles p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .theme-toggle-btn {
            background: var(--bg-element);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle-btn:hover {
            border-color: var(--border-hover);
        }

        .input-box {
            width: 100%;
            height: 140px;
            background: var(--bg-element);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            font-size: 13px;
            resize: vertical;
            outline: none;
        }

        .input-box:focus {
            border-color: var(--primary-btn);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .counter-badge {
            background: var(--bg-element);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            flex: 1;
            min-width: 110px;
            padding: 11px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background-color: var(--bg-element);
            color: var(--text-main);
        }

        .btn:hover {
            border-color: var(--border-hover);
        }

        .btn-pdf { 
            background-color: var(--primary-btn); 
            color: #fff; 
            border: 1px solid var(--primary-btn); 
        }
        .btn-pdf:hover { background-color: var(--primary-hover); }

        .btn-clear { background-color: transparent; color: var(--text-muted); border: 1px solid transparent; }
        .btn-clear:hover { color: #f87171; background-color: rgba(248, 113, 113, 0.05); }

        .preview-wrapper { margin-top: 24px; width: 100%; overflow-x: auto; }
        
        #printable-area {
            background: #ffffff;
            color: #000000;
            padding: 16px;
            border-radius: 10px;
            min-width: 500px;
            direction: rtl;
        }

        table.orders-table { width: 100%; border-collapse: collapse; }
        
        table.orders-table td.order-cell {
            width: 48%;
            vertical-align: top;
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-line;
            direction: rtl;
            text-align: right;
            cursor: text;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
        }
        table.orders-table td.order-cell:hover {
            background-color: #f8fafc;
        }
        table.orders-table td.order-cell:focus {
            background-color: #ffffff;
            outline: 2px solid #10b981;
            border-radius: 4px;
        }

        table.orders-table td.divider-cell { width: 4%; border-right: 2px solid #111; padding: 0; }
        
        table.orders-table tr.order-row {
            border-bottom: 1px solid #e2e8f0;
            page-break-inside: avoid !important;
            break-inside: avoid !important;
            -webkit-column-break-inside: avoid !important; /* الحل الخاص بالآيفون */
        }

        @media (max-width: 480px) {
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="workspace">
        <div class="header">
            <div class="header-titles">
                <h1></h1>
                <p></p>
            </div>
            <button class="theme-toggle-btn" onclick="switchTheme()">
                <span>🎨 الثيم:</span>
                <span id="themeNameLabel">ميدنايت إيمرالد</span>
            </button>
        </div>

        <textarea id="rawInput" class="input-box" placeholder="حطي الداتا هنا" oninput="updateStats()"></textarea>

        <div class="meta-bar">
            <span>النظام جاهز للتشغيل</span>
            <span class="counter-badge" id="orderCount">الأوردرات: 0</span>
        </div>

        <div class="actions">
            <button class="btn" onclick="renderData()">معاينة وتعديل</button>
            <button class="btn" onclick="copyTableData()">نسخ الجدول</button>
            <button class="btn btn-pdf" onclick="exportPDF()">تصدير PDF</button>
            <button class="btn btn-clear" onclick="clearAll()">مسح الكل</button>
        </div>

        <div class="preview-wrapper">
            <div id="printable-area"></div>
        </div>
    </div>

    <script>
        const themes = ['theme-emerald', 'theme-amber', 'theme-rose'];
        const themeNames = {
            'theme-emerald': 'ميدنايت إيمرالد',
            'theme-amber': 'أمبير برو',
            'theme-rose': 'فايبر روز'
        };
        let currentThemeIndex = 0;

        function switchTheme() {
            const root = document.documentElement;
            root.classList.remove(themes[currentThemeIndex]);
            
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const newTheme = themes[currentThemeIndex];
            
            root.classList.add(newTheme);
            document.getElementById('themeNameLabel').innerText = themeNames[newTheme];
        }

        function processOrdersData() {
            const rawText = document.getElementById('rawInput').value.trim();
            if (!rawText) return null;

            const cleanedText = rawText.replace(/\[[^\]]+\]\s*(?:[^\n:]+?):\s*/g, '');
            const lines = cleanedText.split('\n');
            const orders = [];
            let currentOrder = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                currentOrder.push(line);
                if (line.includes('توتل') || line.includes('إجمالي') || line.includes('اجمالي')) {
                    orders.push(currentOrder.join('\n'));
                    currentOrder = [];
                }
            }
            if (currentOrder.length > 0) orders.push(currentOrder.join('\n'));

            document.getElementById('orderCount').innerText = `الأوردرات: ${orders.length}`;

            let htmlContent = '<table class="orders-table">';
            for (let i = 0; i < orders.length; i += 2) {
                const o1 = orders[i] || '';
                const o2 = orders[i + 1] || '';
                htmlContent += `
                    <tr class="order-row">
                        <td class="order-cell" contenteditable="true">${o1}</td>
                        <td class="divider-cell"></td>
                        <td class="order-cell" contenteditable="true">${o2}</td>
                    </tr>`;
            }
            htmlContent += '</table>';
            return htmlContent;
        }

        function updateStats() {
            const rawText = document.getElementById('rawInput').value.trim();
            const lines = rawText.replace(/\[[^\]]+\]\s*(?:[^\n:]+?):\s*/g, '').split('\n');
            let count = 0;
            for (let line of lines) {
                if (line.includes('توتل') || line.includes('إجمالي') || line.includes('اجمالي')) count++;
            }
            document.getElementById('orderCount').innerText = `الأوردرات: ${count || (rawText.length > 0 ? 1 : 0)}`;
        }

        function renderData() {
            const htmlContent = processOrdersData();
            if (!htmlContent) { alert('الرجاء لصق البيانات أولاً!'); return false; }
            document.getElementById('printable-area').innerHTML = htmlContent;
            return true;
        }

        function copyTableData() {
            const area = document.getElementById('printable-area');
            if (!area.innerHTML.trim()) {
                if (!renderData()) return;
            }
            
            const cells = area.querySelectorAll('[contenteditable]');
            cells.forEach(c => c.removeAttribute('contenteditable'));

            const range = document.createRange();
            range.selectNode(area);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            
            try {
                document.execCommand('copy');
                alert('تم نسخ الجدول بالتعديلات التي أجريتها بنجاح!');
            } catch (e) {
                alert('فشل النسخ');
            }
            
            window.getSelection().removeAllRanges();
            cells.forEach(c => c.setAttribute('contenteditable', 'true'));
        }

        function exportPDF() {
            const area = document.getElementById('printable-area');
            if (!area.innerHTML.trim()) {
                if (!renderData()) return;
            }

            const cells = area.querySelectorAll('[contenteditable]');
            cells.forEach(c => c.removeAttribute('contenteditable'));

            const opt = {
                margin: 12,
                filename: 'whatsapp_orders.pdf',
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: { scale: 1.5, useCORS: true, letterRendering: true }, /* التعديل هنا للآيفون */
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: 'avoid-all', avoid: ['.order-row'] } /* التعديل هنا للآيفون */
            };

            html2pdf().from(area).set(opt).save().then(() => {
                cells.forEach(c => c.setAttribute('contenteditable', 'true'));
            });
        }

        function clearAll() {
            document.getElementById('rawInput').value = '';
            document.getElementById('printable-area').innerHTML = '';
            document.getElementById('orderCount').innerText = `الأوردرات: 0`;
        }
    </script>
</body>
</html>
