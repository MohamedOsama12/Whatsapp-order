<!DOCTYPE html>
<html lang="ar" dir="rtl" class="theme-emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة أوردرات الواتساب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root.theme-emerald { --bg-base: #060d0a; --bg-surface: #0e1913; --bg-element: #16261e; --border-color: rgba(52, 211, 153, 0.12); --border-hover: rgba(52, 211, 153, 0.35); --text-main: #f0fdf4; --text-muted: #6ee7b7; --accent-glow: rgba(16, 185, 129, 0.2); --primary-btn: #10b981; --primary-hover: #059669; }
        :root.theme-amber { --bg-base: #12100e; --bg-surface: #1a1714; --bg-element: #26221d; --border-color: rgba(245, 158, 11, 0.12); --border-hover: rgba(245, 158, 11, 0.35); --text-main: #fafaf9; --text-muted: #d6d3d1; --accent-glow: rgba(245, 158, 11, 0.2); --primary-btn: #f59e0b; --primary-hover: #d97706; }
        :root.theme-rose { --bg-base: #11090c; --bg-surface: #1c1015; --bg-element: #28171f; --border-color: rgba(244, 63, 94, 0.12); --border-hover: rgba(244, 63, 94, 0.35); --text-main: #fff1f2; --text-muted: #fda4af; --accent-glow: rgba(244, 63, 94, 0.2); --primary-btn: #f43f5e; --primary-hover: #e11d48; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 30px 15px; }

        .workspace { width: 100%; max-width: 900px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; }
        .header-titles h1 { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .header-titles p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .theme-toggle-btn { background: var(--bg-element); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        
        .input-box { width: 100%; height: 140px; background: var(--bg-element); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; font-size: 13px; resize: vertical; outline: none; }
        .input-box:focus { border-color: var(--primary-btn); }
        
        .meta-bar { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; font-size: 12px; color: var(--text-muted); }
        .counter-badge { background: var(--bg-element); color: var(--text-main); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; }

        .actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 100px; padding: 11px; font-weight: 600; border-radius: 10px; cursor: pointer; border: 1px solid var(--border-color); background-color: var(--bg-element); color: var(--text-main); }
        .btn-pdf { background-color: var(--primary-btn); color: #fff; border: none; }

        .preview-wrapper { margin-top: 24px; width: 100%; overflow-x: auto; }
        #printable-area { background: #ffffff; color: #000000; padding: 16px; border-radius: 10px; min-width: 500px; direction: rtl; }

        table.orders-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        table.orders-table td.order-cell {
            width: 48%;
            vertical-align: top;
            padding: 10px;
            font-size: 12px;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            direction: rtl;
            text-align: right;
            border-bottom: 1px solid #e2e8f0;
        }
        table.orders-table td.divider-cell { width: 4%; border-right: 2px solid #000; padding: 0; }
        table.orders-table tr.order-row { page-break-inside: avoid !important; break-inside: avoid !important; }
    </style>
</head>
<body>

    <div class="workspace">
        <div class="header">
            <div class="header-titles">
                <h1>منظومة أوردرات الواتساب</h1>
                <p>إدارة متقدمة وثيمات حديثة</p>
            </div>
            <button class="theme-toggle-btn" onclick="switchTheme()">تبديل الثيم</button>
        </div>

        <textarea id="rawInput" class="input-box" placeholder="ألصق رسائل الواتساب هنا..." oninput="updateStats()"></textarea>

        <div class="meta-bar">
            <span>النظام مستقر وآمن</span>
            <span class="counter-badge" id="orderCount">الأوردرات: 0</span>
        </div>

        <div class="actions">
            <button class="btn" onclick="renderData()">معاينة</button>
            <button class="btn btn-pdf" onclick="exportPDF()">تصدير PDF</button>
            <button class="btn" onclick="clearAll()">مسح الكل</button>
        </div>

        <div class="preview-wrapper">
            <div id="printable-area"></div>
        </div>
    </div>

    <script>
        const themes = ['theme-emerald', 'theme-amber', 'theme-rose'];
        let currentThemeIndex = 0;
        function switchTheme() {
            document.documentElement.classList.remove(themes[currentThemeIndex]);
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.documentElement.classList.add(themes[currentThemeIndex]);
        }

        function processOrdersData() {
            const rawText = document.getElementById('rawInput').value.trim();
            if (!rawText) return null;
            const lines = rawText.replace(/\[[^\]]+\]\s*(?:[^\n:]+?):\s*/g, '').split('\n');
            const orders = [];
            let currentOrder = [];
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                currentOrder.push(line);
                if (line.includes('توتل') || line.includes('إجمالي') || line.includes('اجمالي')) {
                    orders.push(currentOrder.join('\n'));
                    currentOrder = [];
                }
            }
            if (currentOrder.length > 0) orders.push(currentOrder.join('\n'));

            document.getElementById('orderCount').innerText = `الأوردرات: ${orders.length}`;

            let htmlContent = '<table class="orders-table">';
            for (let i = 0; i < orders.length; i += 2) {
                htmlContent += `
                    <tr class="order-row">
                        <td class="order-cell" contenteditable="true">${orders[i] || ''}</td>
                        <td class="divider-cell"></td>
                        <td class="order-cell" contenteditable="true">${orders[i + 1] || ''}</td>
                    </tr>`;
            }
            htmlContent += '</table>';
            return htmlContent;
        }

        function updateStats() {
            const rawText = document.getElementById('rawInput').value.trim();
            if (!rawText) {
                document.getElementById('orderCount').innerText = `الأوردرات: 0`;
                return;
            }
            const lines = rawText.replace(/\[[^\]]+\]\s*(?:[^\n:]+?):\s*/g, '').split('\n');
            let count = 0;
            for (let line of lines) {
                if (line.includes('توتل') || line.includes('إجمالي') || line.includes('اجمالي')) count++;
            }
            document.getElementById('orderCount').innerText = `الأوردرات: ${count || 1}`;
        }

        function renderData() {
            const htmlContent = processOrdersData();
            if (!htmlContent) { alert('الرجاء لصق البيانات أولاً!'); return false; }
            document.getElementById('printable-area').innerHTML = htmlContent;
            return true;
        }

        // دالة التصدير المحسنة لمنع الانهيار على الآيفون للمستندات الكبيرة
        function exportPDF() {
            const area = document.getElementById('printable-area');
            if (!area.innerHTML.trim()) {
                if (!renderData()) return;
            }

            const cells = area.querySelectorAll('[contenteditable]');
            cells.forEach(c => c.removeAttribute('contenteditable'));

            const opt = {
                margin: 5,
                filename: 'whatsapp_orders.pdf',
                image: { type: 'jpeg', quality: 0.92 },
                html2canvas: { 
                    scale: 1.2, // تم خفضها لتناسب ذاكرة الآيفون في الملفات الضخمة (12 صفحة) ولا تحدث كراش
                    useCORS: true, 
                    letterRendering: true,
                    windowWidth: document.documentElement.offsetWidth
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: 'avoid-all', avoid: ['.order-row'] }
            };

            // استخدام try...finally لضمان عدم تعطل خاصية التعديل نهائياً مهما كانت الظروف
            try {
                html2pdf().from(area).set(opt).save().finally(() => {
                    cells.forEach(c => c.setAttribute('contenteditable', 'true'));
                });
            } catch (err) {
                cells.forEach(c => c.setAttribute('contenteditable', 'true'));
                alert('حدث خطأ أثناء التصدير، يرجى المحاولة مرة أخرى.');
            }
        }

        function clearAll() {
            document.getElementById('rawInput').value = '';
            document.getElementById('printable-area').innerHTML = '';
            document.getElementById('orderCount').innerText = `الأوردرات: 0`;
        }
    </script>
</body>
</html>
