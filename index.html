<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الباركود الذكي - بحث الكلمات المفتاحية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .loader { border-top-color: #4f46e5; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .scanning-line { height: 2px; background: #10b981; position: absolute; width: 100%; top: 0; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <main class="container mx-auto px-4 py-6">

        <!-- Upload Section -->
        <section id="upload-section" class="max-w-xl mx-auto bg-white rounded-3xl shadow-2xl p-8 text-center my-10 border-4 border-indigo-50">
            <div class="mb-6"><i class="fa-solid fa-file-excel text-6xl text-indigo-500"></i></div>
            <h2 class="text-2xl font-bold mb-4">ارفع ملف المنتجات أولاً</h2>
            <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-3 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"/>
        </section>

        <!-- Main Dashboard -->
        <section id="dashboard-section" class="hidden space-y-6">
            
            <!-- Stats -->
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
                <span class="text-slate-500">إجمالي المنتجات المحملة: <b id="total-count" class="text-indigo-600">0</b></span>
                <button onclick="location.reload()" class="text-red-500 text-sm font-bold"><i class="fa-solid fa-rotate"></i> استبدال الملف</button>
            </div>

            <!-- Search Tabs -->
            <div class="bg-white rounded-3xl shadow-lg overflow-hidden">
                <div class="flex bg-slate-100">
                    <button onclick="switchTab('text')" id="tab-text-btn" class="flex-1 py-4 font-bold text-indigo-600 bg-white shadow-inner">بحث يدوي</button>
                    <button onclick="switchTab('camera')" id="tab-camera-btn" class="flex-1 py-4 font-bold text-slate-500">بحث بالكاميرا (ذكاء اصطناعي)</button>
                </div>

                <div class="p-6">
                    <!-- Text Search -->
                    <div id="tab-text-content">
                        <input type="text" id="search-input" oninput="manualSearch()" placeholder="اكتب أي شيء عن المنتج..." class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl py-4 px-6 focus:border-indigo-500 outline-none transition-all">
                    </div>

                    <!-- Camera Search -->
                    <div id="tab-camera-content" class="hidden space-y-4">
                        <div class="relative max-w-sm mx-auto rounded-2xl overflow-hidden bg-black aspect-square">
                            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
                            <div class="scanning-line"></div>
                        </div>
                        
                        <!-- Progress Indicator -->
                        <div id="ocr-loading" class="hidden">
                            <div class="loader w-8 h-8 border-4 border-slate-200 rounded-full mx-auto"></div>
                            <p class="text-center text-sm mt-2 text-indigo-600 font-bold" id="ocr-status">جاري استخراج الكلمات المفتاحية...</p>
                        </div>

                        <button onclick="captureAndAnalyze()" id="capture-btn" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-bold text-lg hover:bg-emerald-600 shadow-lg flex items-center justify-center gap-3">
                            <i class="fa-solid fa-bolt"></i> التقاط وتحليل المنتج
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- List -->
                <div class="bg-white rounded-3xl p-6 shadow-sm">
                    <h3 class="font-bold mb-4 text-slate-700"><i class="fa-solid fa-list-ul ml-2"></i>النتائج المقترحة</h3>
                    <div id="results-list" class="space-y-3 max-h-96 overflow-y-auto">
                        <p class="text-slate-400 text-center py-10">بانتظار البحث أو الالتقاط...</p>
                    </div>
                </div>

                <!-- Active Barcode -->
                <div class="bg-white rounded-3xl p-6 shadow-lg border-2 border-indigo-100 text-center sticky top-4">
                    <h3 class="font-bold mb-4 text-indigo-600 border-b pb-2">باركود الكاشير</h3>
                    <div id="barcode-area" class="flex flex-col items-center py-6">
                        <div id="empty-barcode" class="text-slate-300">
                            <i class="fa-solid fa-barcode text-9xl"></i>
                            <p class="mt-4">اختر منتجاً لعرض الباركود</p>
                        </div>
                        <div id="active-barcode" class="hidden w-full">
                            <h2 id="display-name" class="text-xl font-black mb-1"></h2>
                            <p id="display-code" class="text-indigo-500 font-mono font-bold mb-4"></p>
                            <div class="bg-white p-4 inline-block border rounded-xl">
                                <svg id="barcode-svg"></svg>
                            </div>
                            <button onclick="window.print()" class="mt-6 w-full bg-slate-800 text-white py-3 rounded-xl font-bold hover:bg-black transition">طباعة الملصق</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let products = [];
        let cameraStream = null;

        // 1. قراءة الملف مع تطوير استخراج الكود
        document.getElementById('excel-file-input').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                products = [];

                workbook.SheetNames.forEach(sheet => {
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheet], { header: 1 });
                    rows.forEach(row => {
                        if (row.length < 1) return;
                        let nums = row.filter(c => /^\d+$/.test(String(c)));
                        let texts = row.filter(c => /[a-zA-Zأ-ي]/.test(String(c)));
                        
                        let code = nums.reduce((a, b) => String(a).length >= String(b).length ? a : b, '');
                        let name = texts.reduce((a, b) => String(a).length >= String(b).length ? a : b, '');

                        if (code && String(code).length > 2) {
                            products.push({
                                code: String(code),
                                name: String(name || 'منتج غير مسمى'),
                                searchField: normalizeText(row.join(' '))
                            });
                        }
                    });
                });
                document.getElementById('total-count').innerText = products.length;
                document.getElementById('upload-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        // 2. محرك البحث الذكي (Keyword Scoring)
        function findBestMatch(ocrText) {
            const queryWords = normalizeText(ocrText).split(/\s+/).filter(w => w.length > 2);
            if (queryWords.length === 0) return [];

            let scoredProducts = products.map(p => {
                let score = 0;
                queryWords.forEach(word => {
                    if (p.searchField.includes(word)) {
                        score += word.length; // الكلمات الأطول لها وزن أكبر
                    }
                });
                return { ...p, score };
            });

            return scoredProducts
                .filter(p => p.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 10);
        }

        // 3. التقاط الصورة وتحليلها
        async function captureAndAnalyze() {
            const video = document.getElementById('video');
            const loader = document.getElementById('ocr-loading');
            const status = document.getElementById('ocr-status');
            const btn = document.getElementById('capture-btn');

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            loader.classList.remove('hidden');
            btn.disabled = true;
            status.innerText = "جاري قراءة النصوص من العبوة...";

            try {
                // استخدام Tesseract لقراءة العربي والإنجليزي معاً
                const result = await Tesseract.recognize(canvas, 'ara+eng');
                const text = result.data.text;
                console.log("Extracted Text:", text);

                const matches = findBestMatch(text);
                
                if (matches.length > 0) {
                    renderResults(matches);
                    selectProduct(matches[0]); // اختيار أول نتيجة هي الأقرب تلقائياً
                    status.innerText = "تم العثور على المنتج!";
                } else {
                    alert("لم نتمكن من تمييز كلمات مفتاحية كافية. حاول تقريب الكاميرا من اسم المنتج.");
                }
            } catch (err) {
                alert("خطأ في التحليل: " + err.message);
            } finally {
                loader.classList.add('hidden');
                btn.disabled = false;
            }
        }

        function renderResults(list) {
            const container = document.getElementById('results-list');
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = '<p class="text-center py-10 text-slate-400">لا توجد نتائج مطابقة</p>';
                return;
            }

            list.forEach(p => {
                const div = document.createElement('div');
                div.className = "p-4 border-2 border-slate-100 rounded-2xl hover:border-indigo-500 cursor-pointer transition-all flex justify-between items-center bg-slate-50 hover:bg-white";
                div.onclick = () => selectProduct(p);
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-800">${p.name}</h4>
                        <p class="text-xs font-mono text-indigo-500">${p.code}</p>
                    </div>
                    <i class="fa-solid fa-chevron-left text-slate-300"></i>
                `;
                container.appendChild(div);
            });
        }

        function selectProduct(p) {
            document.getElementById('empty-barcode').classList.add('hidden');
            document.getElementById('active-barcode').classList.remove('hidden');
            document.getElementById('display-name').innerText = p.name;
            document.getElementById('display-code').innerText = "CODE: " + p.code;
            
            JsBarcode("#barcode-svg", p.code, {
                format: "CODE128",
                width: 2.5,
                height: 80,
                displayValue: false
            });
        }

        function manualSearch() {
            const query = document.getElementById('search-input').value;
            renderResults(findBestMatch(query));
        }

        function normalizeText(str) {
            if (!str) return "";
            return String(str)
                .toLowerCase()
                .replace(/[أإآ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/[^a-z0-9أ-ي\s]/g, ' ')
                .trim();
        }

        function switchTab(tab) {
            document.getElementById('tab-text-content').classList.toggle('hidden', tab !== 'text');
            document.getElementById('tab-camera-content').classList.toggle('hidden', tab !== 'camera');
            document.getElementById('tab-text-btn').className = tab === 'text' ? 'flex-1 py-4 font-bold text-indigo-600 bg-white shadow-inner' : 'flex-1 py-4 font-bold text-slate-500';
            document.getElementById('tab-camera-btn').className = tab === 'camera' ? 'flex-1 py-4 font-bold text-indigo-600 bg-white shadow-inner' : 'flex-1 py-4 font-bold text-slate-500';
            
            if (tab === 'camera') startCamera(); else stopCamera();
        }

        async function startCamera() {
            cameraStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: 1280, height: 720 } 
            });
            document.getElementById('video').srcObject = cameraStream;
        }

        function stopCamera() {
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        }
    </script>
</body>
</html>
