<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الكاشير الاحترافي - معالجة متقدمة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f0f4f8; }
        .focus-area { border: 2px solid #10b981; position: absolute; inset: 20%; border-radius: 15px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.6); pointer-events: none; }
        .scan-line { position: absolute; width: 100%; height: 2px; background: #10b981; top: 0; animation: scanMove 2.5s infinite; }
        @keyframes scanMove { 0% { top: 20%; } 100% { top: 80%; } }
    </style>
</head>
<body class="pb-10">

    <main class="container mx-auto px-4 py-6 max-w-2xl">
        
        <!-- التحميل -->
        <div id="upload-zone" class="bg-white p-8 rounded-3xl shadow-xl text-center border-4 border-dashed border-indigo-100 mb-6">
            <h1 class="text-xl font-black text-slate-800 mb-4">ارفع ملف المنتجات (Excel)</h1>
            <input type="file" id="file-input" accept=".xlsx, .xls" class="block w-full text-sm file:bg-indigo-600 file:text-white file:px-6 file:py-2 file:rounded-full file:border-0 cursor-pointer"/>
        </div>

        <div id="dashboard" class="hidden space-y-5">
            <!-- نافذة الكاميرا -->
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden relative">
                <div class="relative aspect-[4/3] bg-black">
                    <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
                    <div class="focus-area"><div class="scan-line"></div></div>
                </div>
                
                <div class="p-4 bg-white">
                    <button onclick="processImage()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition">
                        <i class="fa-solid fa-bolt-lightning mr-2"></i> قراءة المنتج الآن
                    </button>
                </div>
            </div>

            <!-- لوحة النتائج -->
            <div id="loading" class="hidden bg-indigo-50 p-4 rounded-2xl text-center animate-pulse border border-indigo-200">
                <span class="text-indigo-700 font-bold">جاري تنظيف الصورة وقراءة الكلمات...</span>
            </div>

            <div class="bg-slate-800 p-4 rounded-2xl shadow-inner overflow-hidden">
                <p class="text-slate-400 text-xs mb-2">النص المنقح والمستخرج:</p>
                <div id="extracted-text-display" class="text-green-400 font-mono text-sm leading-relaxed min-h-[40px]">
                    بانتظار المسح...
                </div>
            </div>

            <div id="results-container" class="space-y-3">
                <!-- النتائج ستظهر هنا -->
            </div>
        </div>
    </main>

    <script>
        let products = [];
        
        // 1. تنظيف النصوص
        function cleanString(str) {
            if (!str) return "";
            return String(str).toLowerCase().trim()
                .replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي")
                .replace(/[^a-z0-9أ-ي\s]/g, " ").replace(/\s+/g, " ");
        }

        // 2. معالجة ملف الإكسيل
        document.getElementById('file-input').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, {type:'array'});
                products = [];
                wb.SheetNames.forEach(sh => {
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sh], {header:1});
                    rows.forEach(row => {
                        let cells = row.map(c => String(c || ""));
                        let code = cells.find(c => /^\d{5,}$/.test(c)) || "";
                        let name = cells.find(c => /[a-zA-Zأ-ي]/.test(c)) || "";
                        if(name) products.push({ code, name, searchBag: cleanString(cells.join(" ")) });
                    });
                });
                document.getElementById('upload-zone').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                startCamera();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        });

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: 1280, height: 720 } 
            });
            document.getElementById('video').srcObject = stream;
        }

        // 3. تحسين الصورة برمجياً قبل الـ OCR (السر في الدقة)
        function enhanceImage(canvas) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                // تحويل لرمادي
                const avg = (data[i] + data[i+1] + data[i+2]) / 3;
                // زيادة التباين (Thresholding) لجعل الحروف سوداء والخلفية بيضاء
                const val = avg > 140 ? 255 : 0; 
                data[i] = data[i+1] = data[i+2] = val;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        async function processImage() {
            const video = document.getElementById('video');
            const loader = document.getElementById('loading');
            const textDisplay = document.getElementById('extracted-text-display');
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // قص المنطقة التي بداخل المربع فقط لتركيز الدقة
            ctx.drawImage(video, 0, 0);
            enhanceImage(canvas); // تشغيل الفلتر المطور

            loader.classList.remove('hidden');
            textDisplay.innerText = "جاري التحليل...";

            try {
                const result = await Tesseract.recognize(canvas, 'ara+eng', {
                    tessedit_pageseg_mode: 11 // وضع قراءة النصوص المتفرقة ( Sparse Text )
                });

                // 4. استخراج الكلمات المنفصلة وتنظيفها من "الهلوسة" الرقمية
                const rawWords = result.data.text.split(/\s+/);
                const validWords = rawWords.filter(word => {
                    // شروط الكلمة الحقيقية: طولها > 2، تحتوي حروف أو أرقام، ليست رموز عشوائية
                    return word.length > 2 && /[a-zA-Zأ-ي0-9]/.test(word);
                });

                textDisplay.innerText = validWords.join(" | ");

                performSearch(validWords);

            } catch (err) {
                alert("حدث خطأ في القراءة: " + err.message);
            } finally {
                loader.classList.add('hidden');
            }
        }

        // 5. نظام البحث بالكلمات المنفصلة (Multi-Keyword Search)
        function performSearch(keywords) {
            if (keywords.length === 0) return;

            const results = products.map(p => {
                let score = 0;
                keywords.forEach(word => {
                    const cleanWord = cleanString(word);
                    if (p.searchBag.includes(cleanWord)) {
                        score += (cleanWord.length * 5); // وزن للكلمات الأطول
                    }
                });
                return { ...p, score };
            })
            .filter(p => p.score > 0)
            .sort((a, b) => b.score - a.score)
            .slice(0, 5);

            renderResults(results);
        }

        function renderResults(list) {
            const container = document.getElementById('results-container');
            container.innerHTML = list.length ? "" : "<p class='text-center text-slate-500 py-4'>لا توجد تطابقات دقيقة</p>";
            
            list.forEach(p => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl shadow border-r-4 border-indigo-500 flex justify-between items-center";
                div.innerHTML = `
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">${p.name}</h3>
                        <p class="text-xs text-indigo-500 font-mono">${p.code}</p>
                    </div>
                    <span class="bg-indigo-50 text-indigo-600 px-2 py-1 rounded text-[10px] font-bold">دقة: ${p.score}</span>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
