<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Manager Pro | Smart Inventory & Labeling</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;700&display=swap');
        
        body { font-family: 'Inter', 'Noto Sans Arabic', sans-serif; background-color: #f8fafc; }
        
        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 1);
        }

        /* Label Printing Styles (40mm x 30mm) */
        @media print {
            body * { visibility: hidden; }
            #printSection, #printSection * { visibility: visible; }
            #printSection {
                position: absolute;
                left: 0; top: 0;
                width: 40mm;
                height: 30mm;
                padding: 2mm;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: white;
            }
            @page { size: 40mm 30mm; margin: 0; }
        }

        .search-suggestion:hover { background-color: #f1f5f9; cursor: pointer; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
        
        #video-preview { transform: scaleX(-1); } /* Mirror for front camera */
    </style>
</head>
<body class="text-slate-800">

    <!-- Navigation Header -->
    <nav class="glass-morphism sticky top-0 z-50 px-6 py-4 shadow-sm flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">Retail<span class="text-slate-500">Manager</span></h1>
        <div class="flex gap-4" id="main-tabs">
            <button onclick="switchTab('import')" class="tab-btn tab-active px-3 py-1 font-medium">Data Import</button>
            <button onclick="switchTab('search')" class="tab-btn px-3 py-1 font-medium">Cashier Search</button>
            <button onclick="switchTab('ocr')" class="tab-btn px-3 py-1 font-medium">OCR Scanner</button>
        </div>
        <div id="status-indicator" class="flex items-center gap-2 text-xs font-semibold text-red-500">
            <span class="w-2 h-2 rounded-full bg-red-500"></span> Database Offline
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">

        <!-- 1. IMPORT SECTION -->
        <section id="tab-import" class="tab-content block">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 glass-morphism p-8 rounded-2xl shadow-sm border-2 border-dashed border-blue-200 text-center">
                    <input type="file" id="excel-upload" accept=".xlsx, .xls" class="hidden">
                    <label for="excel-upload" class="cursor-pointer block">
                        <svg class="mx-auto h-12 w-12 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <p class="mt-4 text-lg font-semibold">Upload Master Inventory Excel</p>
                        <p class="text-sm text-slate-500">Expected Sheets: "Active List ", "Delist ", "Not for sale "</p>
                    </label>
                </div>
                <div class="glass-morphism p-6 rounded-2xl">
                    <h3 class="font-bold mb-4 border-bottom pb-2">Live Statistics</h3>
                    <div id="stats-container" class="space-y-3">
                        <p class="flex justify-between text-sm"><span>Total Products:</span> <span id="stat-total" class="font-bold">0</span></p>
                        <hr>
                        <p class="flex justify-between text-sm text-green-600"><span>Active List:</span> <span id="stat-active">0</span></p>
                        <p class="flex justify-between text-sm text-orange-600"><span>Delist:</span> <span id="stat-delist">0</span></p>
                        <p class="flex justify-between text-sm text-red-600"><span>Not for sale:</span> <span id="stat-nfs">0</span></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. CASHIER SEARCH SECTION -->
        <section id="tab-search" class="tab-content hidden">
            <div class="max-w-3xl mx-auto space-y-6">
                <div class="relative">
                    <input type="text" id="product-search-input" placeholder="Search by Name (Arabic/English) or Material Code..." 
                           class="w-full p-4 pr-12 rounded-xl border-2 border-blue-100 focus:border-blue-500 focus:ring-0 outline-none text-lg">
                    <div id="search-results" class="absolute w-full mt-2 glass-morphism rounded-xl shadow-xl max-h-80 overflow-y-auto hidden z-50">
                        <!-- Results injected here -->
                    </div>
                </div>

                <!-- Product Display Card -->
                <div id="product-card" class="hidden glass-morphism p-8 rounded-3xl shadow-lg border-t-4 border-blue-500 animate-fade-in">
                    <div class="flex flex-col md:flex-row justify-between gap-8">
                        <div class="flex-1 space-y-4 text-right">
                            <h2 id="view-title-ar" class="text-3xl font-bold text-slate-800"></h2>
                            <p id="view-title-en" class="text-xl text-slate-500 italic"></p>
                            <div class="grid grid-cols-2 gap-4 pt-4">
                                <div class="bg-slate-50 p-3 rounded-lg"><span class="block text-xs text-slate-400">Material Code</span><span id="view-code" class="font-mono font-bold"></span></div>
                                <div class="bg-slate-50 p-3 rounded-lg"><span class="block text-xs text-slate-400">Package</span><span id="view-pkg" class="font-bold"></span></div>
                                <div class="bg-slate-50 p-3 rounded-lg"><span class="block text-xs text-slate-400">Group</span><span id="view-group" class="font-bold"></span></div>
                                <div class="bg-slate-50 p-3 rounded-lg"><span class="block text-xs text-slate-400">Status</span><span id="view-status" class="font-bold"></span></div>
                            </div>
                        </div>
                        <div class="flex flex-col items-center justify-center p-6 bg-white rounded-2xl border">
                            <svg id="barcode-display"></svg>
                            <button onclick="window.print()" class="mt-6 bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">Print Label</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 3. OCR SCANNER SECTION -->
        <section id="tab-ocr" class="tab-content hidden">
            <div class="max-w-2xl mx-auto flex flex-col items-center">
                <div id="camera-container" class="relative rounded-2xl overflow-hidden bg-black w-full aspect-video shadow-2xl mb-6">
                    <video id="video-preview" class="w-full h-full object-cover" autoplay playsinline></video>
                    <div class="absolute inset-0 border-2 border-white/30 pointer-events-none flex items-center justify-center">
                        <div class="w-64 h-32 border-2 border-yellow-400 rounded-lg"></div>
                    </div>
                </div>
                
                <div class="flex gap-4">
                    <button id="start-camera" class="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold">Open Camera</button>
                    <button id="capture-ocr" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Scan Label Text</button>
                </div>

                <div id="ocr-loading" class="hidden mt-4 text-blue-600 font-bold animate-pulse">Processing Intelligence Match...</div>
                
                <div id="ocr-results" class="w-full mt-8 space-y-4">
                    <!-- Ranked OCR matches appear here -->
                </div>
            </div>
        </section>

    </main>

    <!-- Hidden Print Template -->
    <div id="printSection" class="hidden">
        <div style="font-size: 10pt; font-weight: bold; text-align: center; width: 100%;" id="print-name-ar"></div>
        <div style="font-size: 7pt; text-align: center; margin-bottom: 2mm;" id="print-name-en"></div>
        <svg id="print-barcode"></svg>
        <div style="font-size: 8pt; font-weight: bold; margin-top: 1mm;" id="print-meta"></div>
    </div>

    <script>
        /** 
         * STATE MANAGEMENT 
         */
        let masterDatabase = [];
        let stats = { active: 0, delist: 0, nfs: 0 };

        /**
         * 1. ARABIC NORMALIZATION ENGINE
         * Strips diacritics and unifies variations of Alef, Taa, Yaa
         */
        const normalizeArabic = (text) => {
            if (!text) return "";
            return text
                .replace(/[\u064B-\u065F]/g, "") // Remove Harakat
                .replace(/[أإآ]/g, "ا")
                .replace(/ة/g, "ه")
                .replace(/[ى]/g, "ي")
                .trim()
                .toLowerCase();
        };

        /**
         * 2. DATA IMPORT ENGINE
         */
        document.getElementById('excel-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                masterDatabase = [];
                stats = { active: 0, delist: 0, nfs: 0 };

                // Process specific sheets
                const sheetMappings = {
                    "Active List ": "Active",
                    "Delist ": "Delisted",
                    "Not for sale ": "NFS"
                };

                workbook.SheetNames.forEach(sheetName => {
                    if (sheetMappings[sheetName]) {
                        const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                        const processed = jsonData.map(item => ({
                            material: String(item['Material'] || ''),
                            desc_en: String(item['Material Description'] || ''),
                            desc_ar: String(item['Secondary Desc'] || ''),
                            pkg: item['Per Package'] || '1',
                            group: item['Group Code'] || 'N/A',
                            status_desc: item['Sal./Ord.Stat. Desc.'] || '',
                            sheet: sheetMappings[sheetName],
                            searchKey: normalizeArabic(`${item['Secondary Desc']} ${item['Material Description']} ${item['Material']}`)
                        }));
                        
                        masterDatabase.push(...processed);
                        if (sheetMappings[sheetName] === "Active") stats.active += processed.length;
                        if (sheetMappings[sheetName] === "Delisted") stats.delist += processed.length;
                        if (sheetMappings[sheetName] === "NFS") stats.nfs += processed.length;
                    }
                });

                updateStatsUI();
                document.getElementById('status-indicator').innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500"></span> ${masterDatabase.length} Products Loaded`;
                document.getElementById('status-indicator').classList.replace('text-red-500', 'text-green-500');
                alert("Database synchronized successfully!");
            };
            reader.readAsArrayBuffer(file);
        });

        function updateStatsUI() {
            document.getElementById('stat-total').innerText = masterDatabase.length;
            document.getElementById('stat-active').innerText = stats.active;
            document.getElementById('stat-delist').innerText = stats.delist;
            document.getElementById('stat-nfs').innerText = stats.nfs;
        }

        /**
         * 3. SMART SEARCH ENGINE
         */
        const searchInput = document.getElementById('product-search-input');
        const resultsBox = document.getElementById('search-results');

        searchInput.addEventListener('input', (e) => {
            const query = normalizeArabic(e.target.value);
            if (query.length < 2) {
                resultsBox.classList.add('hidden');
                return;
            }

            const matches = masterDatabase.filter(item => item.searchKey.includes(query)).slice(0, 8);
            displayResults(matches);
        });

        function displayResults(matches) {
            resultsBox.innerHTML = '';
            if (matches.length === 0) {
                resultsBox.innerHTML = '<div class="p-4 text-slate-400">No products found...</div>';
            } else {
                matches.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'search-suggestion p-4 border-b flex justify-between items-center';
                    div.innerHTML = `
                        <div class="text-right">
                            <div class="font-bold">${item.desc_ar}</div>
                            <div class="text-xs text-slate-500">${item.desc_en}</div>
                        </div>
                        <div class="text-left font-mono text-blue-600 font-bold">${item.material}</div>
                    `;
                    div.onclick = () => selectProduct(item);
                    resultsBox.appendChild(div);
                });
            }
            resultsBox.classList.remove('hidden');
        }

        function selectProduct(item) {
            resultsBox.classList.add('hidden');
            const card = document.getElementById('product-card');
            card.classList.remove('hidden');
            
            document.getElementById('view-title-ar').innerText = item.desc_ar;
            document.getElementById('view-title-en').innerText = item.desc_en;
            document.getElementById('view-code').innerText = item.material;
            document.getElementById('view-pkg').innerText = item.pkg;
            document.getElementById('view-group').innerText = item.group;
            document.getElementById('view-status').innerText = item.sheet;

            // Generate Barcode
            JsBarcode("#barcode-display", item.material, {
                format: "CODE128",
                width: 2,
                height: 60,
                displayValue: true
            });

            // Prepare Print View
            document.getElementById('print-name-ar').innerText = item.desc_ar;
            document.getElementById('print-name-en').innerText = item.desc_en;
            document.getElementById('print-meta').innerText = `PKG: ${item.pkg} | ${item.material}`;
            JsBarcode("#print-barcode", item.material, {
                format: "CODE128",
                width: 1.5,
                height: 40,
                displayValue: false
            });
        }

        /**
         * 4. SMART OCR & CAMERA LOGIC
         */
        const video = document.getElementById('video-preview');
        const startBtn = document.getElementById('start-camera');
        const captureBtn = document.getElementById('capture-ocr');

        startBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
        };

        captureBtn.onclick = async () => {
            document.getElementById('ocr-loading').classList.remove('hidden');
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const { data: { text } } = await Tesseract.recognize(canvas, 'eng+ara');
            processOCRResult(text);
        };

        function processOCRResult(rawText) {
            document.getElementById('ocr-loading').classList.add('hidden');
            const tokens = normalizeArabic(rawText).split(/\s+/).filter(t => t.length > 2);
            
            // Scoring System (Simple Overlap)
            const scored = masterDatabase.map(product => {
                let score = 0;
                tokens.forEach(token => {
                    if (product.searchKey.includes(token)) score++;
                });
                return { ...product, score };
            })
            .filter(p => p.score > 0)
            .sort((a, b) => b.score - a.score)
            .slice(0, 5);

            displayOCRMatches(scored);
        }

        function displayOCRMatches(matches) {
            const container = document.getElementById('ocr-results');
            container.innerHTML = '<h3 class="font-bold text-slate-500 underline">Matches Found via Vision:</h3>';
            
            if (matches.length === 0) {
                container.innerHTML += '<p class="p-4 bg-yellow-50 rounded-lg">Could not identify text clearly. Try closer.</p>';
                return;
            }

            matches.forEach(item => {
                const div = document.createElement('div');
                div.className = 'glass-morphism p-4 rounded-xl flex justify-between items-center border-r-4 border-green-500 cursor-pointer hover:bg-green-50';
                div.innerHTML = `
                    <div class="text-right">
                        <div class="font-bold">${item.desc_ar}</div>
                        <div class="text-xs text-slate-500 italic">${item.desc_en}</div>
                    </div>
                    <div class="bg-green-100 text-green-700 px-3 py-1 rounded text-xs font-bold">Match Score: ${item.score}</div>
                `;
                div.onclick = () => {
                    switchTab('search');
                    selectProduct(item);
                };
                container.appendChild(div);
            });
        }

        /**
         * 5. UI UTILITIES
         */
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('tab-active'));
            
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            event.target.classList.add('tab-active');

            // Stop camera if not in OCR tab
            if (tabId !== 'ocr' && video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
        }
    </script>
</body>
</html>
