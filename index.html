<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Gemini HDR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #111; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
        
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; }
        
        .camera-box { position: relative; width: 100%; height: 350px; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        video.mirror { transform: scaleX(-1); }
        
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .btn-switch { padding: 10px 16px; background: #333; color: #fff; border: none; border-radius: 20px; cursor: pointer; }
        .btn-capture { width: 65px; height: 65px; border-radius: 50%; background: #e11d48; border: 4px solid #fff; cursor: pointer; }
        
        .gallery { width: 100%; display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .card { background: #222; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #333; }
        .card img { width: 100%; border-radius: 6px; }
        .card .response { font-size: 0.85rem; color: #ddd; white-space: pre-wrap; background: #181818; padding: 8px; border-radius: 6px; max-height: 150px; overflow-y: auto; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <input type="password" id="apiKey" placeholder="ضع Gemini API Key هنا">

    <div class="camera-box">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <button class="btn-switch" id="switchBtn">🔄 تبديل الكاميرا</button>
        <button class="btn-capture" id="captureBtn"></button>
    </div>

    <div class="gallery" id="gallery"></div>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchBtn');
    const apiKeyInput = document.getElementById('apiKey');
    const gallery = document.getElementById('gallery');

    let stream = null;
    let facingMode = "environment";

    if (localStorage.getItem("gemini_key")) {
        apiKeyInput.value = localStorage.getItem("gemini_key");
    }

    async function initCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode },
                audio: false
            });
            video.srcObject = stream;
            video.classList.toggle('mirror', facingMode === 'user');
        } catch (e) {
            alert("خطأ تشغيل الكاميرا: " + e.message);
        }
    }

    switchBtn.onclick = () => {
        facingMode = facingMode === "user" ? "environment" : "user";
        initCamera();
    };

    captureBtn.onclick = async () => {
        const key = apiKeyInput.value.trim();
        if (!key) return alert("يرجى إدخال API Key أولاً");
        localStorage.setItem("gemini_key", key);

        if (!video.videoWidth) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');

        if (facingMode === 'user') {
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        const base64 = dataUrl.split(',')[1];

        // عنصر العرض في المعرض
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <img src="${dataUrl}">
            <div class="response">⏳ جاري الإرسال وتطبيق /HDR...</div>
        `;
        gallery.prepend(card);
        const respBox = card.querySelector('.response');

        // إرسال لـ Gemini
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "/HDR" },
                            { inline_data: { mime_type: "image/jpeg", data: base64 } }
                        ]
                    }]
                })
            });
            const data = await res.json();
            if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                respBox.innerText = data.candidates[0].content.parts[0].text;
            } else if (data.error) {
                respBox.innerText = "❌ خطأ: " + data.error.message;
            }
        } catch (err) {
            respBox.innerText = "❌ خطأ اتصال: " + err.message;
        }
    };

    initCamera();
</script>
</body>
</html>
